name: HITEK Cloud

on:
  push:
    branches: [hitek/cloud-hosting]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested image to the configured HITEK staging host
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hitek-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: pnpm typecheck
      - run: pnpm lint
      - name: HITEK regression tests
        run: pnpm exec vitest run server/hitek-supabase-auth.test.ts server/hitek-cloud-api.test.ts server/account-signin.test.ts server/mcp-oauth.test.ts server/routes/hitek-connect.test.ts scripts/hitek-cloud.test.mjs scripts/hitek-usage-export.test.mjs src/lib/analytics.test.ts src/lib/analytics.wire.test.ts src/pair/PairPage.test.ts server/brand.test.ts src/lib/brand.test.ts
      - name: Deployment script syntax
        run: bash -n deploy/hitek/cloud/deploy.sh && bash -n deploy/hitek/cloud/backup.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24 }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: reference
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:hitek-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: server
          load: true
          tags: ${{ steps.reference.outputs.image }}
          cache-from: type=gha,scope=hitek-cloud
          cache-to: type=gha,scope=hitek-cloud,mode=max
      - name: Verify the isolated HTTPS deployment
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
        run: node scripts/smoke-hitek-cloud.mjs "$IMAGE"
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
        run: |
          docker push "$IMAGE"
          echo "HITEK_IMAGE=$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/hitek/cloud-hosting'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hitek-staging
    steps:
      - name: Deploy to the pre-provisioned HITEK host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ "$DEPLOY_PUBLIC_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/hitek-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/hitek-known-hosts"
          trap 'rm -f "$RUNNER_TEMP/hitek-deploy-key" "$RUNNER_TEMP/hitek-known-hosts"' EXIT
          ssh -i "$RUNNER_TEMP/hitek-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hitek-known-hosts" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$DEPLOY_PATH/deploy.sh' '$IMAGE'"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$DEPLOY_PUBLIC_URL/api/health" | grep -q '"app":"openmausbot"'
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$DEPLOY_PUBLIC_URL/api/bots")
          test "$status" = 403 || test "$status" = 401
